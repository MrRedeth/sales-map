<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SalesMap – Administration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <span class="nav-icon">🌍</span>
        <span class="nav-title">SalesMap</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          Map
        </a>
        <a href="admin.html" class="nav-link active">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Administration
        </a>
      </div>
    </div>
  </nav>

  <!-- ADMIN CONTAINER -->
  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h1 class="admin-title">Sales Rep Management</h1>
        <p class="admin-subtitle">Add, edit or remove sales reps and their assigned countries.</p>
      </div>
      <button class="btn btn-primary" id="add-rep-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Sales Rep
      </button>
    </div>

    <!-- REPS GRID -->
    <div id="reps-grid">
      <!-- Cards generated by admin.js -->
    </div>

    <!-- EMPTY STATE -->
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">👥</div>
      <h2>No sales reps yet</h2>
      <p>Click "Add Sales Rep" to get started.</p>
    </div>
  </div>

  <!-- ========== MODAL ========== -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 id="modal-title">Add Sales Rep</h2>
        <button class="modal-close" id="modal-close-btn" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- Name -->
        <div class="form-group">
          <label class="form-label" for="rep-name">Sales Rep Name</label>
          <input type="text" id="rep-name" class="form-input" placeholder="E.g. John Smith" />
          <span class="form-error hidden" id="name-error">Name is required.</span>
        </div>

        <!-- Color -->
        <div class="form-group">
          <label class="form-label" for="rep-color">Color</label>
          <div class="color-picker-row">
            <input type="color" id="rep-color" class="color-input" value="#3B82F6" />
            <span id="color-hex-label" class="color-hex">#3B82F6</span>
            <div class="color-presets" id="color-presets">
              <!-- Generated in admin.js -->
            </div>
          </div>
        </div>

        <!-- Countries -->
        <div class="form-group">
          <label class="form-label">Assigned Countries</label>
          <div class="country-selector">
            <!-- Search -->
            <div class="country-search-wrapper">
              <svg class="country-search-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="text" id="country-search" class="country-search-input"
                placeholder="Search country..." />
              <button class="country-search-clear hidden" id="search-clear-btn" aria-label="Clear">✕</button>
            </div>

            <!-- Tabs -->
            <div class="country-tabs">
              <button class="country-tab active" id="tab-all" data-tab="all">All</button>
              <button class="country-tab" id="tab-selected" data-tab="selected">
                Selected (<span id="selected-count">0</span>)
              </button>
            </div>

            <!-- List -->
            <div class="country-list" id="country-list">
              <!-- Checkboxes generated in admin.js -->
            </div>
          </div>

          <!-- Selected tags -->
          <div class="selected-tags" id="selected-tags">
            <!-- Tags generated dynamically -->
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="save-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- CONFIRM DELETE DIALOG -->
  <div id="confirm-overlay" class="modal-overlay hidden">
    <div class="modal confirm-modal" role="dialog">
      <div class="modal-header">
        <h2>Confirm Deletion</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message">Are you sure you want to delete this sales rep?</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="confirm-cancel-btn">Cancel</button>
        <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <!-- App JS -->
  <script src="js/countries.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
